<svg viewBox="0 0 1200 260" width="1200" height="260" xmlns="http://www.w3.org/2000/svg">
  <!-- White background so the banner is legible on any GitHub theme -->
  <rect x="0" y="0" width="1200" height="260" rx="20" fill="#FFFFFF" stroke="#E7E7E7" stroke-width="1.5" />

  <!-- Logo, left-aligned -->
  <g transform="translate(70,34) scale(6)">
    <path
      d="M16 2 L28 8 L24 26 L16 30 L8 26 L4 8 Z"
      fill="none"
      stroke="#000000"
      stroke-width="2"
      stroke-linejoin="round"
    />
    <path
      d="M10 10 L16 24 L22 10"
      fill="none"
      stroke="#000000"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <circle cx="10" cy="10" r="2" fill="#000000" />
    <circle cx="22" cy="10" r="2" fill="#000000" />
    <circle cx="16" cy="24" r="2" fill="#000000" />
    <circle cx="16" cy="14" r="1.5" fill="#000000" />
    <line x1="16" y1="14" x2="10" y2="10" stroke="#000000" stroke-width="0.8" opacity="0.5" />
    <line x1="16" y1="14" x2="22" y2="10" stroke="#000000" stroke-width="0.8" opacity="0.5" />
    <line x1="16" y1="14" x2="16" y2="24" stroke="#000000" stroke-width="0.8" opacity="0.5" />
  </g>

  <!-- Title + tagline, right of the logo -->
  <text x="300" y="140" font-family="Helvetica, Arial, sans-serif" font-size="62" font-weight="700" fill="#0B0B0C">Verace V1</text>
  <text x="302" y="178" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#5B5F66">Next-generation, multimodal LLM architecture</text>
</svg>
