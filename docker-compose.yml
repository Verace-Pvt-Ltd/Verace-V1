version: '3.8'

services:
  verace-v1-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: verace-v1-serving
    ports:
      - "8000:8000"
    environment:
      - CUDA_VISIBLE_DEVICES=0
      # Required for real inference -- otherwise the model serves random-init output.
      - VERACE_CHECKPOINT_PATH=${VERACE_CHECKPOINT_PATH:-}
      # Required before exposing this beyond local development -- see verace_v1/serving/api.py.
      - VERACE_API_KEY=${VERACE_API_KEY:-}
      - VERACE_CORS_ORIGINS=${VERACE_CORS_ORIGINS:-}
      - VERACE_RATE_LIMIT_PER_MINUTE=${VERACE_RATE_LIMIT_PER_MINUTE:-30}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: always
